[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-benchmark"
version = "0.1.0"
description = "A lightweight benchmarking tool for local LLMs running via Ollama."
authors = [
    { name = "Amit Kot", email = "amit@amitkot.com" }
]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["benchmark", "llm", "local-ai", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "ollama",
    "questionary",
]

[project.urls]
Homepage = "https://github.com/amitkot/ollama-benchmark"
Repository = "https://github.com/amitkot/ollama-benchmark"
Issues = "https://github.com/amitkot/ollama-benchmark/issues"

[project.scripts]
ollama-benchmark = "ollama_bench:main"

[dependency-groups]
dev = [
    "prek>=0.1.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a8",
]

[tool.hatch.build.targets.wheel]
packages = ["ollama_bench"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ty.src]
include = ["ollama_bench", "tests"]

